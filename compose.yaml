services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [aquaguard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: database
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      DOCUMENTS_DIR: ${DOCUMENTS_DIR:-/data/documents}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
    networks: [aquaguard]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    profiles: ["sim"]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SIMULATOR_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks: [aquaguard]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    volumes:
      - ./gateway/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks: [aquaguard]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  aquaguard:
    driver: bridge
