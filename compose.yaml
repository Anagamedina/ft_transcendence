# Every service has the same three security lines:
#   no-new-privileges  it cannot gain more permissions
#   cap_drop: [ALL]    it starts with no extra permissions (capabilities)
#   read_only          its files cannot be changed
# Then each one adds back only what it needs. tmpfs is a folder in memory
# where it can write.
#
# Every service also rotates its Docker log: at most 3 files of 10 MB
# (about 30 MB), and the oldest one is deleted.
services:
  # Runs once before backend and backup, then stops. It gives old volumes,
  # owned by root, to the backend (10001) and backup (10002) users.
  volume-permissions:
    image: alpine:3.21
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    cap_add: [CHOWN, DAC_READ_SEARCH]
    command: ["sh", "-c", "chown -R 10001:10001 /documents && chown -R 10002:10002 /backups"]
    volumes:
      - documents_data:/documents
      - backups_data:/backups
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: none

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # Starts as postgres, not root, so it needs no capabilities.
    user: postgres
    tmpfs: [/var/run/postgresql, /tmp]
    mem_limit: 512m
    cpus: 1.0
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [aquaguard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # Runs as user 10001 (see backend/Dockerfile).
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 2.0
    env_file: .env
    environment:
      POSTGRES_HOST: database
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      DOCUMENTS_DIR: ${DOCUMENTS_DIR:-/data/documents}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUPS_DIR: /backups
      # Emails de confirmación (B19). Por defecto van a Mailpit; con
      # SMTP_HOST= (vacío) en el .env no se envía nada.
      SMTP_HOST: ${SMTP_HOST-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@aquaguard.dev}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    expose:
      - "8000"
    volumes:
      - backups_data:/backups:ro
      - documents_data:${DOCUMENTS_DIR:-/data/documents}
    depends_on:
      database:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    networks: [aquaguard]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # Runs as user 10002 (see backup/Dockerfile).
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - backups_data:/backups
    depends_on:
      database:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    networks: [aquaguard]
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'aquaguard-*.sql.gz' -mmin -$$((BACKUP_INTERVAL_HOURS * 60 + 5)) | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Servidor SMTP de pruebas (B19): captura los emails del backend y los
  # enseña en http://localhost:8025. No entrega nada a buzones reales.
  # El backend no depende de él: con Mailpit parado, la app responde igual
  # y el fallo del envío queda en el log. SMTP (1025) solo en la red interna;
  # la web solo en 127.0.0.1, porque enseña los correos sin contraseña.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # The image uses root by default; it does not need it.
    user: "65534:65534"
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    networks: [aquaguard]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    profiles: ["sim"]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # Runs as nobody (see simulator/Dockerfile).
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    env_file: .env
    environment:
      SIMULATOR_API_URL: http://backend:8000
    # service_healthy, not service_started: the backend container exists
    # before its API answers, and readings sent in that gap fail.
    depends_on:
      backend:
        condition: service_healthy
    networks: [aquaguard]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    # nginx starts as root to open ports 80/443 and read the TLS key, then
    # serves requests as the nginx user. Each capability:
    #   NET_BIND_SERVICE  open ports 80 and 443
    #   DAC_READ_SEARCH   read the TLS key
    #   CHOWN             prepare its cache folders
    #   SETUID, SETGID    switch to the nginx user
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH, CHOWN, SETUID, SETGID]
    tmpfs: [/var/cache/nginx, /run, /etc/nginx/conf.d, /tmp]
    mem_limit: 128m
    cpus: 1.0
    environment:
      PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-10r/m}
      PUBLIC_API_RATE_LIMIT: ${PUBLIC_API_RATE_LIMIT:-60r/m}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - ./gateway/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks: [aquaguard]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backups_data:
  documents_data:

networks:
  aquaguard:
    driver: bridge
