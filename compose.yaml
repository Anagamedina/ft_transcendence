services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks: [aquaguard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: database
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks: [aquaguard]

  simulator:
    profiles: ["sim"]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SIMULATOR_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks: [aquaguard]

  gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
    networks: [aquaguard]

volumes:
  postgres_data:

networks:
  aquaguard:
    driver: bridge
