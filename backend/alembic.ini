# ALEMBIC — configuración (script_location = migrations).
# The URL construct in env.py.

# prepend_sys_path:
# - adds `backend/` to the PYTHONPATH. Thanks to that, from `env.py` we can do imports

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

# configuration of logs
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s