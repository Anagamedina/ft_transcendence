server_tokens off;

limit_req_zone $binary_remote_addr zone=public_forms:10m rate=${PUBLIC_RATE_LIMIT};
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/aquaguard.crt;
    ssl_certificate_key /etc/nginx/certs/aquaguard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 429 @rate_limited;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /api/auth/login {
        limit_req zone=public_forms burst=4 nodelay;
        proxy_pass http://backend:8000;
    }

    location = /api/auth/register {
        limit_req zone=public_forms burst=4 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/invitations/by-code/ {
        limit_req zone=public_forms burst=4 nodelay;
        proxy_pass http://backend:8000;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"Demasiadas peticiones. Espera un minuto y vuelve a intentarlo.","details":null}}';
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
